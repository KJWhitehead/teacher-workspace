<!DOCTYPE html>
<html lang="cy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ystafell Ddosbarth Cymraeg - Teacher Workspace & Exit Ticket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Default Welsh Language Curriculum Concepts
        const DEFAULT_CONCEPTS = [
            "Treigladau (Mutations)",
            "Amser Gorffennol (Past Tense)",
            "Patrymau Iaith (Sentence Patterns)",
            "Berfau a Rhagenwau (Verbs & Pronouns)",
            "Ymarfer Siarad (Conversational Practice)"
        ];

        const DEFAULT_STUDENTS = [
            { id: "S1", name: "Elinor Davies", classId: "C1" },
            { id: "S2", name: "Gethin Jones", classId: "C1" },
            { id: "S3", name: "Megan Rees", classId: "C1" },
            { id: "S4", name: "Iwan Thomas", classId: "C1" },
            { id: "S5", name: "Ceri Evans", classId: "C1" }
        ];

        const DEFAULT_CLASSES = [
            { id: "C1", name: "Blwyddyn 10 - Cymraeg Ail Iaith (Year 10 Second Language)" }
        ];

        function App() {
            // State
            const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, ticket, student-view, admin
            const [dashSubTab, setDashSubTab] = useState("understanding"); // understanding, feedback, learner
            
            const [classes, setClasses] = useState(() => {
                const saved = localStorage.getItem('wt_classes');
                return saved ? JSON.parse(saved) : DEFAULT_CLASSES;
            });

            const [selectedClassId, setSelectedClassId] = useState(DEFAULT_CLASSES[0].id);

            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('wt_students');
                return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
            });

            const [concepts, setConcepts] = useState(() => {
                const saved = localStorage.getItem('wt_concepts');
                return saved ? JSON.parse(saved) : DEFAULT_CONCEPTS;
            });

            const [submissions, setSubmissions] = useState(() => {
                const saved = localStorage.getItem('wt_submissions');
                return saved ? JSON.parse(saved) : [
                    { id: "sub-1", studentId: "S1", studentName: "Elinor Davies", classId: "C1", confidence: 4, difficultConcept: "Treigladau (Mutations)", explainable: "Yes", feedback: { clarity: 5, examples: 4, pace: 4, practice: 5, nextSteps: 5 }, date: "Heddiw / Today" },
                    { id: "sub-2", studentId: "S2", studentName: "Gethin Jones", classId: "C1", confidence: 2, difficultConcept: "Amser Gorffennol (Past Tense)", explainable: "No", feedback: { clarity: 3, examples: 3, pace: 2, practice: 3, nextSteps: 2 }, date: "Heddiw / Today" },
                    { id: "sub-3", studentId: "S3", studentName: "Megan Rees", classId: "C1", confidence: 5, difficultConcept: "Ymarfer Siarad (Conversational Practice)", explainable: "Yes", feedback: { clarity: 5, examples: 5, pace: 5, practice: 5, nextSteps: 5 }, date: "Heddiw / Today" },
                    { id: "sub-4", studentId: "S4", studentName: "Iwan Thomas", classId: "C1", confidence: 3, difficultConcept: "Berfau a Rhagenwau (Verbs & Pronouns)", explainable: "Maybe", feedback: { clarity: 4, examples: 3, pace: 3, practice: 4, nextSteps: 3 }, date: "Heddiw / Today" },
                    { id: "sub-5", studentId: "S5", studentName: "Ceri Evans", classId: "C1", confidence: 2, difficultConcept: "Treigladau (Mutations)", explainable: "No", feedback: { clarity: 2, examples: 2, pace: 2, practice: 2, nextSteps: 2 }, date: "Heddiw / Today" }
                ];
            });

            // Student portal state
            const [selectedStudentForPortal, setSelectedStudentForPortal] = useState(DEFAULT_STUDENTS[0].id);
            const [ticketConf, setTicketConf] = useState(4);
            const [ticketDiff, setTicketDiff] = useState(DEFAULT_CONCEPTS[0]);
            const [ticketExplain, setTicketExplain] = useState("Yes");
            const [ticketFb, setTicketFb] = useState({ clarity: 4, examples: 4, pace: 4, practice: 4, nextSteps: 4 });
            const [submittedSuccess, setSubmittedSuccess] = useState(false);

            // Admin input states
            const [newClassName, setNewClassName] = useState("");
            const [newStudentName, setNewStudentName] = useState("");
            const [newConceptName, setNewConceptName] = useState("");
            const [bulkStudentText, setBulkStudentText] = useState("");

            useEffect(() => {
                localStorage.setItem('wt_classes', JSON.stringify(classes));
                localStorage.setItem('wt_students', JSON.stringify(students));
                localStorage.setItem('wt_concepts', JSON.stringify(concepts));
                localStorage.setItem('wt_submissions', JSON.stringify(submissions));
            }, [classes, students, concepts, submissions]);

            // Helper to simulate submissions
            const handleSimulate = () => {
                const classStudents = students.filter(s => s.classId === selectedClassId);
                if (classStudents.length === 0) return;
                
                const newSubs = classStudents.map((st, idx) => ({
                    id: `sim-${Date.now()}-${idx}`,
                    studentId: st.id,
                    studentName: st.name,
                    classId: selectedClassId,
                    confidence: Math.floor(Math.random() * 3) + 2, // 2-5
                    difficultConcept: concepts[Math.floor(Math.random() * concepts.length)],
                    explainable: Math.random() > 0.4 ? "Yes" : "No",
                    feedback: {
                        clarity: Math.floor(Math.random() * 2) + 4,
                        examples: Math.floor(Math.random() * 2) + 4,
                        pace: Math.floor(Math.random() * 2) + 3,
                        practice: Math.floor(Math.random() * 2) + 4,
                        nextSteps: Math.floor(Math.random() * 2) + 4
                    },
                    date: new Date().toLocaleDateString()
                }));
                setSubmissions([...newSubs, ...submissions.filter(s => s.classId !== selectedClassId)]);
            };

            const handleStudentSubmit = (e) => {
                e.preventDefault();
                const studentObj = students.find(s => s.id === selectedStudentForPortal);
                if (!studentObj) return;

                const sub = {
                    id: `sub-${Date.now()}`,
                    studentId: studentObj.id,
                    studentName: studentObj.name,
                    classId: selectedClassId,
                    confidence: Number(ticketConf),
                    difficultConcept: ticketDiff,
                    explainable: ticketExplain,
                    feedback: ticketFb,
                    date: new Date().toLocaleDateString()
                };

                setSubmissions([sub, ...submissions.filter(s => s.studentId !== studentObj.id)]);
                setSubmittedSuccess(true);
            };

            // Selected class filtering
            const currentClass = classes.find(c => c.id === selectedClassId) || classes[0];
            const currentClassStudents = students.filter(s => s.classId === selectedClassId);
            const currentClassSubs = submissions.filter(s => s.classId === selectedClassId);

            // Metrics calculations
            const avgConfidence = currentClassSubs.length > 0 
                ? (currentClassSubs.reduce((acc, curr) => acc + curr.confidence, 0) / currentClassSubs.length).toFixed(1) 
                : 0;

            const needsSupportList = currentClassSubs.filter(s => s.confidence <= 2 || s.explainable === "No");

            // Concept breakdown counts
            const conceptCounts = {};
            concepts.forEach(c => conceptCounts[c] = 0);
            currentClassSubs.forEach(s => {
                if (conceptCounts[s.difficultConcept] !== undefined) {
                    conceptCounts[s.difficultConcept] += 1;
                }
            });

            // Feedback averages
            const fbAverages = {
                clarity: currentClassSubs.length ? (currentClassSubs.reduce((a,b) => a + b.feedback.clarity, 0) / currentClassSubs.length).toFixed(1) : 0,
                examples: currentClassSubs.length ? (currentClassSubs.reduce((a,b) => a + b.feedback.examples, 0) / currentClassSubs.length).toFixed(1) : 0,
                pace: currentClassSubs.length ? (currentClassSubs.reduce((a,b) => a + b.feedback.pace, 0) / currentClassSubs.length).toFixed(1) : 0,
                practice: currentClassSubs.length ? (currentClassSubs.reduce((a,b) => a + b.feedback.practice, 0) / currentClassSubs.length).toFixed(1) : 0,
                nextSteps: currentClassSubs.length ? (currentClassSubs.reduce((a,b) => a + b.feedback.nextSteps, 0) / currentClassSubs.length).toFixed(1) : 0,
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6">
                    {/* Header Bar */}
                    <header className="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-red-600 text-white font-bold text-xs px-2.5 py-1 rounded-full">CYMRAEG</span>
                                <h1 className="text-xl font-bold text-slate-800">Ystafell Ddosbarth / Teacher Workspace</h1>
                            </div>
                            <p className="text-sm text-slate-500 mt-0.5">Exit Ticket & Analytics Dashboard (Dysgu Cymraeg)</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <select 
                                value={selectedClassId} 
                                onChange={(e) => setSelectedClassId(e.target.value)}
                                className="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500">
                                {classes.map(c => (
                                    <option key={c.id} value={c.id}>{c.name}</option>
                                ))}
                            </select>

                            <button 
                                onClick={handleSimulate}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">
                                ⚡ Simulate Responses
                            </button>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-3">
                        <button 
                            onClick={() => setActiveTab("dashboard")}
                            className={`px-4 py-2.5 rounded-xl font-semibold text-sm transition ${activeTab === "dashboard" ? "bg-red-600 text-white shadow" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200"}`}>
                            📊 Teacher Dashboard
                        </button>
                        <button 
                            onClick={() => setActiveTab("ticket")}
                            className={`px-4 py-2.5 rounded-xl font-semibold text-sm transition ${activeTab === "ticket" ? "bg-red-600 text-white shadow" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200"}`}>
                            📝 Exit Ticket & Student Portal
                        </button>
                        <button 
                            onClick={() => setActiveTab("admin")}
                            className={`px-4 py-2.5 rounded-xl font-semibold text-sm transition ${activeTab === "admin" ? "bg-slate-800 text-white shadow" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200"}`}>
                            ⚙️ Admin & Setup Hub
                        </button>
                    </nav>

                    {/* TAB 1: TEACHER DASHBOARD */}
                    {activeTab === "dashboard" && (
                        <div className="space-y-6">
                            {/* Dashboard Sub-tabs */}
                            <div className="flex gap-2 bg-slate-200 p-1 rounded-xl w-fit">
                                <button 
                                    onClick={() => setDashSubTab("understanding")}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition ${dashSubTab === "understanding" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}>
                                    1. Class Understanding / Dealltwriaeth
                                </button>
                                <button 
                                    onClick={() => setDashSubTab("feedback")}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition ${dashSubTab === "feedback" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}>
                                    2. Lesson Feedback / Adborth
                                </button>
                                <button 
                                    onClick={() => setDashSubTab("learner")}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition ${dashSubTab === "learner" ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900"}`}>
                                    3. Learner View / Golwg Dysgwr
                                </button>
                            </div>

                            {/* Sub-Tab 1: Class Understanding */}
                            {dashSubTab === "understanding" && (
                                <div className="space-y-6">
                                    {/* Summary Cards */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Average Confidence (1-5)</p>
                                            <p className="text-3xl font-extrabold text-slate-800 mt-2">{avgConfidence} <span className="text-sm font-normal text-slate-500">/ 5.0</span></p>
                                            <div className="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                                                <div className="bg-red-600 h-full rounded-full" style={{ width: `${(avgConfidence / 5) * 100}%` }}></div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Total Submissions</p>
                                            <p className="text-3xl font-extrabold text-slate-800 mt-2">{currentClassSubs.length} <span className="text-sm font-normal text-slate-500">/ {currentClassStudents.length} students</span></p>
                                            <p className="text-xs text-emerald-600 font-medium mt-3">✓ Active response rate recorded</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Flagged For Support</p>
                                            <p className="text-3xl font-extrabold text-amber-600 mt-2">{needsSupportList.length} <span className="text-sm font-normal text-slate-500">learners</span></p>
                                            <p className="text-xs text-slate-500 mt-3">Confidence ≤ 2 or struggle reported</p>
                                        </div>
                                    </div>

                                    {/* Concept Map & Misconceptions */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <h3 className="font-bold text-slate-800 text-base mb-4">🗺️ Concept Map Difficulty Heatmap</h3>
                                            <div className="space-y-3">
                                                {concepts.map(concept => {
                                                    const count = conceptCounts[concept] || 0;
                                                    const maxCount = Math.max(...Object.values(conceptCounts), 1);
                                                    const percentage = (count / maxCount) * 100;
                                                    return (
                                                        <div key={concept} className="space-y-1">
                                                            <div className="flex justify-between text-sm">
                                                                <span className="font-medium text-slate-700">{concept}</span>
                                                                <span className="text-slate-500 font-semibold">{count} struggles</span>
                                                            </div>
                                                            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                                <div className="bg-red-500 h-full rounded-full transition-all" style={{ width: `${percentage}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-base mb-4">⚠️ Needs Support Priority Roster</h3>
                                                {needsSupportList.length === 0 ? (
                                                    <p className="text-sm text-slate-500 italic py-8 text-center">No students currently flagged for immediate support.</p>
                                                ) : (
                                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                                                        {needsSupportList.map(item => (
                                                            <div key={item.id} className="p-3 bg-red-50 border border-red-100 rounded-xl flex justify-between items-center">
                                                                <div>
                                                                    <p className="font-bold text-slate-800 text-sm">{item.studentName}</p>
                                                                    <p className="text-xs text-red-600 mt-0.5">Difficult concept: {item.difficultConcept}</p>
                                                                </div>
                                                                <span className="bg-red-200 text-red-800 text-xs font-bold px-2.5 py-1 rounded-full">Conf: {item.confidence}/5</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-400 mt-4">* Students reporting low confidence or unable to explain main concepts.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Sub-Tab 2: Lesson Feedback */}
                            {dashSubTab === "feedback" && (
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-lg">📈 Lesson Feedback Averages (Layer 1 - Section B)</h3>
                                        <p className="text-sm text-slate-500">Aggregated feedback metrics across recent Welsh language sessions.</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                            <p className="text-xs text-slate-500 font-medium">Clarity / Eglur</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{fbAverages.clarity} <span className="text-xs text-slate-400">/ 5</span></p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                            <p className="text-xs text-slate-500 font-medium">Examples / Enghreifftiau</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{fbAverages.examples} <span className="text-xs text-slate-400">/ 5</span></p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                            <p className="text-xs text-slate-500 font-medium">Pace / Cyflymder</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{fbAverages.pace} <span className="text-xs text-slate-400">/ 5</span></p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                            <p className="text-xs text-slate-500 font-medium">Practice / Ymarfer</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{fbAverages.practice} <span className="text-xs text-slate-400">/ 5</span></p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                            <p className="text-xs text-slate-500 font-medium">Next Steps / Camau Nesaf</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{fbAverages.nextSteps} <span className="text-xs text-slate-400">/ 5</span></p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Sub-Tab 3: Learner View */}
                            {dashSubTab === "learner" && (
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg">👤 Individual Learner Profile</h3>
                                            <p className="text-sm text-slate-500">Select a student to view their confidence profile and concept history.</p>
                                        </div>
                                        <select 
                                            className="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500"
                                            onChange={(e) => {
                                                const stId = e.target.value;
                                                // handle student selection for view
                                            }}>
                                            {currentClassStudents.map(s => (
                                                <option key={s.id} value={s.id}>{s.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="border-t border-slate-200 pt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {currentClassStudents.slice(0, 1).map(st => {
                                            const studentSubs = submissions.filter(s => s.studentId === st.id);
                                            const lastSub = studentSubs[0];
                                            return (
                                                <div key={st.id} className="md:col-span-3 bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col md:flex-row justify-between gap-6">
                                                    <div>
                                                        <h4 className="text-xl font-bold text-slate-800">{st.name}</h4>
                                                        <p className="text-sm text-slate-500">Class: {currentClass.name}</p>
                                                        <div className="mt-4 space-y-2">
                                                            <p className="text-sm"><strong>Latest Confidence:</strong> {lastSub ? `${lastSub.confidence} / 5` : "No data yet"}</p>
                                                            <p className="text-sm"><strong>Difficult Concept:</strong> {lastSub ? lastSub.difficultConcept : "N/A"}</p>
                                                            <p className="text-sm"><strong>Can explain to peer?</strong> {lastSub ? lastSub.explainable : "N/A"}</p>
                                                        </div>
                                                    </div>
                                                    <div className="bg-white p-4 rounded-xl border border-slate-200 flex-1">
                                                        <h5 className="font-bold text-sm text-slate-700 mb-2">Progression Over Time</h5>
                                                        {studentSubs.length === 0 ? (
                                                            <p className="text-xs text-slate-400 italic">No historical submissions recorded.</p>
                                                        ) : (
                                                            <div className="space-y-2">
                                                                {studentSubs.map((sub, idx) => (
                                                                    <div key={idx} className="flex justify-between items-center text-xs border-b border-slate-100 pb-1.5">
                                                                        <span className="text-slate-500">{sub.date}</span>
                                                                        <span className="font-semibold text-red-600">Confidence: {sub.confidence}/5</span>
                                                                        <span className="text-slate-600 truncate max-w-[150px]">{sub.difficultConcept}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TAB 2: EXIT TICKET & STUDENT PORTAL */}
                    {activeTab === "ticket" && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Student Simulator Form */}
                            <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-lg">📝 Exit Ticket / Tocyn Allan</h3>
                                        <p className="text-sm text-slate-500">Layer 1 Form (Standard Exit Ticket for All Students)</p>
                                    </div>
                                    <select 
                                        value={selectedStudentForPortal}
                                        onChange={(e) => setSelectedStudentForPortal(e.target.value)}
                                        className="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium text-slate-700">
                                        {currentClassStudents.map(s => (
                                            <option key={s.id} value={s.id}>{s.name} (Simulated View)</option>
                                        ))}
                                    </select>
                                </div>

                                {submittedSuccess ? (
                                    <div className="bg-emerald-50 border border-emerald-200 p-8 rounded-2xl text-center space-y-3">
                                        <h4 className="text-lg font-bold text-emerald-800">Diolch! Response Submitted Successfully!</h4>
                                        <p className="text-sm text-emerald-600">Your teacher can now view your feedback and confidence level on their dashboard.</p>
                                        <button 
                                            onClick={() => setSubmittedSuccess(false)}
                                            className="mt-4 bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                            Submit Another Response
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleStudentSubmit} className="space-y-6">
                                        {/* Section A: Understanding */}
                                        <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-800 text-sm uppercase tracking-wider text-red-600">Section A: Dealltwriaeth / Understanding</h4>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">How confident do you feel about today's topic? (1 - 5)</label>
                                                <div className="flex gap-3">
                                                    {[1, 2, 3, 4, 5].map(num => (
                                                        <button
                                                            key={num}
                                                            type="button"
                                                            onClick={() => setTicketConf(num)}
                                                            className={`flex-1 py-2 rounded-lg font-bold text-sm border transition ${ticketConf === num ? "bg-red-600 text-white border-red-600 shadow" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100"}`}>
                                                            {num}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Which part felt most difficult? / Pa ran a oedd fwyaf anodd?</label>
                                                <select 
                                                    value={ticketDiff}
                                                    onChange={(e) => setTicketDiff(e.target.value)}
                                                    className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-700">
                                                    {concepts.map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Could you explain the main idea to another learner?</label>
                                                <div className="flex gap-4">
                                                    {["Yes", "Maybe", "No"].map(opt => (
                                                        <label key={opt} className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                                                            <input 
                                                                type="radio" 
                                                                name="explainable" 
                                                                value={opt} 
                                                                checked={ticketExplain === opt}
                                                                onChange={(e) => setTicketExplain(e.target.value)}
                                                                className="text-red-600 focus:ring-red-500" />
                                                            {opt}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Section B: Learning Experience */}
                                        <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-800 text-sm uppercase tracking-wider text-red-600">Section B: Profiad Dysgu / Learning Experience (1-5)</h4>
                                            
                                            {[
                                                { key: 'clarity', label: 'The explanations were clear. / Roedd yr eglurhad yn glir.' },
                                                { key: 'examples', label: 'The examples helped me understand. / Helpodd yr enghreifftiau fi.' },
                                                { key: 'pace', label: 'The pace felt right. / Roedd y cyflymder yn iawn.' },
                                                { key: 'practice', label: 'I had enough opportunity to practise. / Cefais ddigon o gyfle i ymarfer.' },
                                                { key: 'nextSteps', label: 'I left knowing what I should do next. / Gwyddum beth i wneud nesaf.' }
                                            ].map(item => (
                                                <div key={item.key} className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                                    <span className="text-sm text-slate-700">{item.label}</span>
                                                    <div className="flex gap-1.5">
                                                        {[1, 2, 3, 4, 5].map(score => (
                                                            <button
                                                                key={score}
                                                                type="button"
                                                                onClick={() => setTicketFb({...ticketFb, [item.key]: score})}
                                                                className={`w-8 h-8 rounded-lg font-bold text-xs border ${ticketFb[item.key] === score ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100"}`}>
                                                                {score}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            type="submit"
                                            className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow">
                                            Cyflwyno Tocyn Allan / Submit Exit Ticket
                                        </button>
                                    </form>
                                )}
                            </div>

                            {/* Share Link & QR Code Suite */}
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center space-y-4">
                                    <h3 className="font-bold text-slate-800 text-base">📱 Share Link & QR Code</h3>
                                    <p className="text-xs text-slate-500">Display this QR code on your classroom projector or share the link with students.</p>
                                    
                                    <div className="bg-slate-100 p-6 rounded-xl border border-slate-200 flex justify-center items-center">
                                        <div className="w-36 h-36 bg-white p-2 rounded-lg shadow-sm border border-slate-200 flex flex-col items-center justify-center">
                                            <svg className="w-28 h-28 text-slate-800" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm10-2h8v8h-8V2zm2 2v4h4V4h-4zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm12-2h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2z"/>
                                            </svg>
                                            <span className="text-[10px] text-slate-500 font-bold mt-1">SCAN ME</span>
                                        </div>
                                    </div>

                                    <input 
                                        type="text" 
                                        readOnly 
                                        value={window.location.href}
                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs text-slate-600 text-center" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 3: ADMIN & SETUP HUB */}
                    {activeTab === "admin" && (
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-8">
                            <div>
                                <h3 className="font-bold text-slate-800 text-lg">⚙️ Admin Setup & Customization Hub</h3>
                                <p className="text-sm text-slate-500">Configure your classes, student rosters, and custom Welsh language concepts.</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {/* Classes */}
                                <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <h4 className="font-bold text-slate-800 text-sm">1. Manage Classes</h4>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Class Name..." 
                                            value={newClassName}
                                            onChange={(e) => setNewClassName(e.target.value)}
                                            className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                                        <button 
                                            onClick={() => {
                                                if (!newClassName.trim()) return;
                                                const newC = { id: `c-${Date.now()}`, name: newClassName };
                                                setClasses([...classes, newC]);
                                                setSelectedClassId(newC.id);
                                                setNewClassName("");
                                            }}
                                            className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium">Add</button>
                                    </div>
                                    <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                        {classes.map(c => (
                                            <div key={c.id} className="text-xs bg-white p-2.5 rounded-lg border border-slate-200 font-medium text-slate-700">
                                                {c.name}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Students */}
                                <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <h4 className="font-bold text-slate-800 text-sm">2. Add Students</h4>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Student Name..." 
                                            value={newStudentName}
                                            onChange={(e) => setNewStudentName(e.target.value)}
                                            className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                                        <button 
                                            onClick={() => {
                                                if (!newStudentName.trim()) return;
                                                const newSt = { id: `st-${Date.now()}`, name: newStudentName, classId: selectedClassId };
                                                setStudents([...students, newSt]);
                                                setNewStudentName("");
                                            }}
                                            className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium">Add</button>
                                    </div>
                                    <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                        {currentClassStudents.map(st => (
                                            <div key={st.id} className="text-xs bg-white p-2.5 rounded-lg border border-slate-200 font-medium text-slate-700">
                                                {st.name}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Welsh Concepts */}
                                <div className="space-y-4 bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <h4 className="font-bold text-slate-800 text-sm">3. Welsh Concepts / Topics</h4>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Concept / Vocabulary..." 
                                            value={newConceptName}
                                            onChange={(e) => setNewConceptName(e.target.value)}
                                            className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                                        <button 
                                            onClick={() => {
                                                if (!newConceptName.trim()) return;
                                                setConcepts([...concepts, newConceptName]);
                                                setNewConceptName("");
                                            }}
                                            className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium">Add</button>
                                    </div>
                                    <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                        {concepts.map(con => (
                                            <div key={con} className="text-xs bg-white p-2.5 rounded-lg border border-slate-200 font-medium text-slate-700">
                                                {con}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
