<!DOCTYPE html>
<html lang="cy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocyn Allan - Student Exit Ticket</title>
    <script>
        console.warn = (function(oldWarn) {
            return function(msg) {
                if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com')) return;
                oldWarn.apply(console, arguments);
            };
        })(console.warn);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6 flex justify-center items-center">

    <script>
        // PASTE YOUR SUPABASE KEYS HERE:
        const SUPABASE_URL = "https://izffsjjtjconjwypogqb.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "sb_publishable_IGCowO7Vf0mId9X8C8n9iw_DpR-6ZP-";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <div id="app" class="w-full max-w-xl">
        <div id="form-container" class="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
            <div class="border-b border-slate-700 pb-4">
                <span id="class-badge" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold px-2 py-0.5 rounded-full uppercase">Dosbarth Cymraeg</span>
                <h1 id="poll-topic" class="text-xl font-bold text-white mt-2">Tocyn Allan / Exit Ticket</h1>
                <p class="text-xs text-slate-400">Welsh Language Exit Ticket</p>
            </div>

            <form id="ticket-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Eich Enw / Your Name:</label>
                    <input type="text" id="studentName" required placeholder="e.g. Mali Evans" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="space-y-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60">
                    <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Section A: Dealltwriaeth / Understanding</h2>
                    
                    <div>
                        <label class="block text-xs text-slate-300 mb-2">How confident do you feel about today's topic? (1 - 5)</label>
                        <div class="flex gap-2" id="confidence-selector">
                            <button type="button" data-val="1" class="conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-slate-900 border-slate-700 text-slate-400">1</button>
                            <button type="button" data-val="2" class="conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-slate-900 border-slate-700 text-slate-400">2</button>
                            <button type="button" data-val="3" class="conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-emerald-600 border-emerald-500 text-white shadow-lg">3</button>
                            <button type="button" data-val="4" class="conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-slate-900 border-slate-700 text-slate-400">4</button>
                            <button type="button" data-val="5" class="conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-slate-900 border-slate-700 text-slate-400">5</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Which part felt most difficult today?</label>
                        <select id="difficultConcept" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Could you explain the main rule to another learner?</label>
                        <div class="flex gap-2" id="explain-selector">
                            <button type="button" data-val="Yes" class="explain-btn flex-1 py-2 rounded-xl font-semibold text-xs border bg-slate-900 border-slate-700 text-slate-400">Yes</button>
                            <button type="button" data-val="Almost" class="explain-btn flex-1 py-2 rounded-xl font-semibold text-xs border bg-emerald-600 border-emerald-500 text-white">Almost</button>
                            <button type="button" data-val="Not yet" class="explain-btn flex-1 py-2 rounded-xl font-semibold text-xs border bg-slate-900 border-slate-700 text-slate-400">Not yet</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60">
                    <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Section B: Profiad Dysgu / Learning Experience</h2>
                    <div id="feedback-questions-container" class="space-y-3">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/30">
                    Cyflwyno / Submit Exit Ticket
                </button>
            </form>
        </div>

        <div id="success-container" class="hidden bg-slate-800 p-8 rounded-2xl border border-emerald-500/30 text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h2 class="text-xl font-bold text-white">Diolch! Response Submitted!</h2>
            <p class="text-sm text-slate-400">Your feedback has been sent to your teacher.</p>
            <button onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-xl transition">
                Submit Another Response
            </button>
        </div>
    </div>

    <script>
        let selectedConfidence = 3;
        let selectedExplain = 'Almost';
        let feedbackRatings = {};

        function getUrlClassId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('class');
        }

        function loadPoll() {
            const classes = JSON.parse(localStorage.getItem('welsh_classes') || '[]');
            const urlClassId = getUrlClassId();

            let currentClass = classes.find(c => c.id === urlClassId);
            
            if (!currentClass) {
                currentClass = classes.length > 0 ? classes[0] : {
                    id: 'default-class',
                    name: 'Dysgu Cymraeg',
                    topicTitle: 'Exit Ticket',
                    concepts: ["Treiglad Meddal", "Amser Presennol", "Amser Gorffennol", "Amser Dyfodol"],
                    feedbackQuestions: ["The explanations were clear.", "The examples helped me understand."]
                };
            }

            document.getElementById('class-badge').innerText = currentClass.name;
            document.getElementById('poll-topic').innerText = currentClass.topicTitle;

            const conceptSelect = document.getElementById('difficultConcept');
            conceptSelect.innerHTML = '';
            (currentClass.concepts || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                conceptSelect.appendChild(opt);
            });

            const fbContainer = document.getElementById('feedback-questions-container');
            fbContainer.innerHTML = '';
            feedbackRatings = {};

            (currentClass.feedbackQuestions || []).forEach((q, idx) => {
                feedbackRatings[idx] = 4;
                const row = document.createElement('div');
                row.className = 'flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs border-b border-slate-800 pb-2 last:border-b-0';
                row.innerHTML = `
                    <span class="text-slate-300 flex-1">${q}</span>
                    <div class="flex gap-1 justify-end" data-qindex="${idx}">
                        <button type="button" onclick="setRating(${idx}, 1)" class="rate-btn-${idx} w-6 h-6 rounded text-[10px] font-bold border bg-slate-900 text-slate-400 border-slate-700">1</button>
                        <button type="button" onclick="setRating(${idx}, 2)" class="rate-btn-${idx} w-6 h-6 rounded text-[10px] font-bold border bg-slate-900 text-slate-400 border-slate-700">2</button>
                        <button type="button" onclick="setRating(${idx}, 3)" class="rate-btn-${idx} w-6 h-6 rounded text-[10px] font-bold border bg-slate-900 text-slate-400 border-slate-700">3</button>
                        <button type="button" onclick="setRating(${idx}, 4)" class="rate-btn-${idx} w-6 h-6 rounded text-[10px] font-bold border bg-slate-200 text-slate-900 border-white">4</button>
                        <button type="button" onclick="setRating(${idx}, 5)" class="rate-btn-${idx} w-6 h-6 rounded text-[10px] font-bold border bg-slate-900 text-slate-400 border-slate-700">5</button>
                    </div>
                `;
                fbContainer.appendChild(row);
            });
        }

        function setRating(qIndex, score) {
            feedbackRatings[qIndex] = score;
            document.querySelectorAll(`.rate-btn-${qIndex}`).forEach(btn => {
                const val = parseInt(btn.innerText);
                if (val === score) {
                    btn.className = `rate-btn-${qIndex} w-6 h-6 rounded text-[10px] font-bold border bg-slate-200 text-slate-900 border-white`;
                } else {
                    btn.className = `rate-btn-${qIndex} w-6 h-6 rounded text-[10px] font-bold border bg-slate-900 text-slate-400 border-slate-700`;
                }
            });
        }

        document.querySelectorAll('.conf-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.conf-btn').forEach(b => {
                    b.className = 'conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-slate-900 border-slate-700 text-slate-400';
                });
                e.target.className = 'conf-btn flex-1 py-2.5 rounded-xl font-bold text-sm border bg-emerald-600 border-emerald-500 text-white shadow-lg';
                selectedConfidence = e.target.getAttribute('data-val');
            });
        });

        document.querySelectorAll('.explain-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.explain-btn').forEach(b => {
                    b.className = 'explain-btn flex-1 py-2 rounded-xl font-semibold text-xs border bg-slate-900 border-slate-700 text-slate-400';
                });
                e.target.className = 'explain-btn flex-1 py-2 rounded-xl font-semibold text-xs border bg-emerald-600 border-emerald-500 text-white';
                selectedExplain = e.target.getAttribute('data-val');
            });
        });

        document.getElementById('ticket-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Submitting...";

            const studentName = document.getElementById('studentName').value;
            const difficultConcept = document.getElementById('difficultConcept').value;
            const classId = getUrlClassId() || 'default-class';

            const { error } = await supabase.from('exit_tickets').insert([
                {
                    class_id: classId,
                    student_name: studentName,
                    confidence: selectedConfidence,
                    difficult_concept: difficultConcept,
                    can_explain: selectedExplain,
                    feedback_ratings: feedbackRatings
                }
            ]);

            btn.disabled = false;
            btn.innerText = "Cyflwyno / Submit Exit Ticket";

            if (error) {
                alert("Submission failed. Please check your internet connection.");
                console.error(error);
                return;
            }

            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('success-container').classList.remove('hidden');
        });

        function resetForm() {
            document.getElementById('studentName').value = '';
            document.getElementById('form-container').classList.remove('hidden');
            document.getElementById('success-container').classList.add('hidden');
        }

        loadPoll();
    </script>
</body>
</html>
