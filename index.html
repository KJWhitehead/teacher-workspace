<!DOCTYPE html>
<html lang="cy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tocyn Allan - Exit Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6 flex justify-center items-center">
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const DEFAULT_CONCEPTS = [
            "Treigladau (Mutations - Soft, Nasal, Aspirate)",
            "Amser Gorffennol (Past Tense - Ga i, Mi wnes i)",
            "Berfau a Rhagenwau (Verbs & Pronouns)",
            "Patrymau Iaith (Sentence Patterns & Word Order)",
            "Ymarfer Siarad (Conversational Confidence)"
        ];

        function StudentPortal() {
            const [confidence, setConfidence] = useState(3);
            const [difficultConcept, setDifficultConcept] = useState(DEFAULT_CONCEPTS[0]);
            const [difficultyReflection, setDifficultyReflection] = useState('');
            const [canExplain, setCanExplain] = useState('Almost');
            const [explanationText, setExplanationText] = useState('');
            const [studentName, setStudentName] = useState('');
            const [feedback, setFeedback] = useState({ clarity: 4, examples: 4, pace: 4, practice: 4, nextSteps: 4 });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!studentName.trim()) {
                    alert("Os gwelwch yn dda, nodwch eich enw. / Please enter your name.");
                    return;
                }

                const submission = {
                    id: `sub-${Date.now()}`,
                    studentName,
                    confidence,
                    difficultConcept,
                    difficultyReflection,
                    canExplain,
                    explanationText,
                    feedback,
                    timestamp: new Date().toISOString()
                };

                // Store in shared local memory or cloud endpoint
                const existing = JSON.parse(localStorage.getItem('welsh_et_submissions') || '[]');
                localStorage.setItem('welsh_et_submissions', JSON.stringify([submission, ...existing]));

                setSubmitted(true);
            };

            if (submitted) {
                return (
                    <div className="bg-slate-800 p-8 rounded-2xl border border-emerald-500/30 text-center space-y-4 shadow-2xl">
                        <div className="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                        <h2 className="text-xl font-bold text-white">Diolch! Response Submitted!</h2>
                        <p className="text-sm text-slate-400">Your feedback has been sent to your teacher's dashboard.</p>
                        <button 
                            onClick={() => setSubmitted(false)}
                            className="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-xl transition">
                            Submit Another Response
                        </button>
                    </div>
                );
            }

            return (
                <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
                    <div className="border-b border-slate-700 pb-4">
                        <span className="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold px-2 py-0.5 rounded-full uppercase">Dysgu Cymraeg</span>
                        <h1 className="text-xl font-bold text-white mt-2">Tocyn Allan / Student Exit Ticket</h1>
                        <p className="text-xs text-slate-400">Share your understanding and lesson feedback below.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div>
                            <label className="block text-xs font-semibold text-slate-300 mb-1">Eich Enw / Your Name:</label>
                            <input 
                                type="text" 
                                required
                                placeholder="e.g. Mali Evans"
                                value={studentName}
                                onChange={(e) => setStudentName(e.target.value)}
                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
                        </div>

                        {/* Section A */}
                        <div className="space-y-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60">
                            <h2 className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Section A: Dealltwriaeth / Understanding</h2>
                            
                            <div>
                                <label className="block text-xs text-slate-300 mb-2">How confident do you feel about today's topic? (1-5)</label>
                                <div className="flex gap-2">
                                    {[1, 2, 3, 4, 5].map(num => (
                                        <button
                                            key={num}
                                            type="button"
                                            onClick={() => setConfidence(num)}
                                            className={`flex-1 py-2.5 rounded-xl font-bold text-sm border transition ${confidence === num ? 'bg-emerald-600 border-emerald-500 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                                            {num}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs text-slate-300 mb-1">Which part felt most difficult today?</label>
                                <select 
                                    value={difficultConcept}
                                    onChange={(e) => setDifficultConcept(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                                    {DEFAULT_CONCEPTS.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs text-slate-300 mb-1">Could you explain the main rule to another learner?</label>
                                <div className="flex gap-2">
                                    {['Yes', 'Almost', 'Not yet'].map(opt => (
                                        <button
                                            key={opt}
                                            type="button"
                                            onClick={() => setCanExplain(opt)}
                                            className={`flex-1 py-2 rounded-xl font-semibold text-xs border ${canExplain === opt ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Section B */}
                        <div className="space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60">
                            <h2 className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Section B: Profiad Dysgu / Learning Experience</h2>
                            {[
                                { key: 'clarity', label: 'The explanations were clear.' },
                                { key: 'examples', label: 'The examples helped me understand.' },
                                { key: 'pace', label: 'The pace felt right.' },
                                { key: 'practice', label: 'I had enough practice time.' },
                                { key: 'nextSteps', label: 'I left knowing what to do next.' }
                            ].map(item => (
                                <div key={item.key} className="flex items-center justify-between text-xs">
                                    <span className="text-slate-300 max-w-[200px]">{item.label}</span>
                                    <div className="flex gap-1">
                                        {[1, 2, 3, 4, 5].map(score => (
                                            <button
                                                key={score}
                                                type="button"
                                                onClick={() => setFeedback({ ...feedback, [item.key]: score })}
                                                className={`w-6 h-6 rounded text-[10px] font-bold border ${feedback[item.key] === score ? 'bg-slate-200 text-slate-900 border-white' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>
                                                {score}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            type="submit" 
                            className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/30">
                            Cyflwyno / Submit Exit Ticket
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.render(<StudentPortal />, document.getElementById('root'));
    </script>
</body>
</html>
