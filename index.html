<!DOCTYPE html>
<html lang="cy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cymraeg Pulse - Welsh Language Teacher Workspace & Exit Ticket</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts CDN -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, CartesianGrid, Cell 
        } = window.Recharts || {};

        // Default Welsh Classes and Rosters
        const INITIAL_WELSH_CLASSES = [
          {
            id: 'welsh-101',
            name: 'Dosbarth Blwyddyn 8 - Cymraeg Ail Iaith',
            subject: 'Welsh Second Language',
            grade: 'Year 8',
            concepts: [
              'Treigladau (Mutations - Soft, Nasal, Aspirate)',
              'Amser Gorffennol (Past Tense - Ga i, Mi wnes i)',
              'Berfau a Rhagenwau (Verbs & Pronouns)',
              'Patrymau Iaith (Sentence Patterns & Word Order)',
              'Ymarfer Siarad (Conversational Confidence)'
            ],
            students: [
              { id: 'st-1', name: 'Mali Evans', avatar: 'ME' },
              { id: 'st-2', name: 'Rhys Davies', avatar: 'RD' },
              { id: 'st-3', name: 'Sian Hughes', avatar: 'SH' },
              { id: 'st-4', name: 'Tomos Griffiths', avatar: 'TG' },
              { id: 'st-5', name: 'Carys Owen', avatar: 'CO' },
              { id: 'st-6', name: 'Dylan Williams', avatar: 'DW' },
              { id: 'st-7', name: 'Eira Thomas', avatar: 'ET' },
              { id: 'st-8', name: 'Iwan Roberts', avatar: 'IR' }
            ]
          },
          {
            id: 'welsh-102',
            name: 'Year 10 GCSE Welsh - Foundation',
            subject: 'Welsh Language',
            grade: 'Year 10',
            concepts: [
              'Hoffi / Ddim yn hoffi Expressions',
              'Treiglad Meddal (Soft Mutation Rules)',
              'Ateb Cwestiynau (Answering Questions)',
              'Geirfa Gorffennaf (Holiday Vocabulary)'
            ],
            students: [
              { id: 'st-201', name: 'Megan Jones', avatar: 'MJ' },
              { id: 'st-202', name: 'Jack Morgan', avatar: 'JM' },
              { id: 'st-203', name: 'Ffion Lewis', avatar: 'FL' }
            ]
          }
        ];

        // Initial Exit Tickets
        const INITIAL_TICKETS = [
          {
            id: 'ticket-w1',
            classId: 'welsh-101',
            title: 'Treigladau a’r Amser Gorffennol (Mutations & Past Tense)',
            date: '2026-10-23',
            active: true,
            topic: 'Treiglad Meddal a Berfau (Soft Mutation & Verbs)',
            targetConcepts: [
              'Treigladau (Mutations - Soft, Nasal, Aspirate)',
              'Amser Gorffennol (Past Tense - Ga i, Mi wnes i)',
              'Berfau a Rhagenwau (Verbs & Pronouns)'
            ]
          }
        ];

        // Initial Submissions
        const INITIAL_SUBMISSIONS = [
          {
            id: 'sub-w1',
            ticketId: 'ticket-w1',
            studentId: 'st-1',
            studentName: 'Mali Evans',
            timestamp: '2026-10-23T10:15:00Z',
            confidence: 5,
            difficultConcept: 'Treigladau (Mutations - Soft, Nasal, Aspirate)',
            difficultyReflection: 'Knowing when "p, t, c" change to "b, d, g" in spoken Welsh.',
            canExplain: 'Yes',
            explanationText: 'To form the past tense with "Mi wnes i", the following verb takes a soft mutation!',
            clarity: 5, examples: 5, pace: 4, practice: 5, nextSteps: 5
          },
          {
            id: 'sub-w2',
            ticketId: 'ticket-w1',
            studentId: 'st-2',
            studentName: 'Rhys Davies',
            timestamp: '2026-10-23T10:16:00Z',
            confidence: 2,
            difficultConcept: 'Treigladau (Mutations - Soft, Nasal, Aspirate)',
            difficultyReflection: 'I get confused between soft mutation and nasal mutation after "yn".',
            canExplain: 'Not yet',
            explanationText: 'I know words change letters at the start, but I forget the exact letter pairs.',
            clarity: 3, examples: 3, pace: 2, practice: 2, nextSteps: 3
          },
          {
            id: 'sub-w3',
            ticketId: 'ticket-w1',
            studentId: 'st-3',
            studentName: 'Sian Hughes',
            timestamp: '2026-10-23T10:18:00Z',
            confidence: 1,
            difficultConcept: 'Amser Gorffennol (Past Tense - Ga i, Mi wnes i)',
            difficultyReflection: 'Difference between "wnes i" and "roeddwn i".',
            canExplain: 'Not yet',
            explanationText: 'I am not sure how to conjugate the past tense verbs correctly without checking notes.',
            clarity: 2, examples: 2, pace: 1, practice: 2, nextSteps: 2
          },
          {
            id: 'sub-w4',
            ticketId: 'ticket-w1',
            studentId: 'st-4',
            studentName: 'Tomos Griffiths',
            timestamp: '2026-10-23T10:20:00Z',
            confidence: 4,
            difficultConcept: 'Berfau a Rhagenwau (Verbs & Pronouns)',
            difficultyReflection: 'Remembering all pronoun endings.',
            canExplain: 'Yes',
            explanationText: 'Sentence structure always starts with the verb in Welsh, unlike English!',
            clarity: 5, examples: 4, pace: 4, practice: 4, nextSteps: 5
          }
        ];

        function App() {
          const [classes, setClasses] = useState(() => {
            const saved = localStorage.getItem('welsh_et_classes');
            return saved ? JSON.parse(saved) : INITIAL_WELSH_CLASSES;
          });

          const [tickets, setTickets] = useState(() => {
            const saved = localStorage.getItem('welsh_et_tickets');
            return saved ? JSON.parse(saved) : INITIAL_TICKETS;
          });

          const [submissions, setSubmissions] = useState(() => {
            const saved = localStorage.getItem('welsh_et_submissions');
            return saved ? JSON.parse(saved) : INITIAL_SUBMISSIONS;
          });

          const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || '');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [dashSubTab, setDashSubTab] = useState('understanding');
          const [selectedStudentId, setSelectedStudentId] = useState(classes[0]?.students[0]?.id || '');

          const [showQRModal, setShowQRModal] = useState(false);
          const [showNewClassModal, setShowNewClassModal] = useState(false);
          const [showNewTicketModal, setShowNewTicketModal] = useState(false);
          const [copiedLink, setCopiedLink] = useState(false);

          const [newClassName, setNewClassName] = useState('');
          const [newClassSubject, setNewClassSubject] = useState('');
          const [newClassGrade, setNewClassGrade] = useState('');
          const [bulkStudentNames, setBulkStudentNames] = useState('');
          const [newConceptInput, setNewConceptInput] = useState('');

          const [newTicketTitle, setNewTicketTitle] = useState('');
          const [newTicketTopic, setNewTicketTopic] = useState('');

          const [activeStudentId, setActiveStudentId] = useState('');
          const [studentForm, setStudentForm] = useState({
            confidence: 3,
            difficultConcept: '',
            difficultyReflection: '',
            canExplain: 'Almost',
            explanationText: '',
            clarity: 4, examples: 4, pace: 4, practice: 4, nextSteps: 4
          });
          const [submittedSuccess, setSubmittedSuccess] = useState(false);

          useEffect(() => {
            localStorage.setItem('welsh_et_classes', JSON.stringify(classes));
            localStorage.setItem('welsh_et_tickets', JSON.stringify(tickets));
            localStorage.setItem('welsh_et_submissions', JSON.stringify(submissions));
          }, [classes, tickets, submissions]);

          const currentClass = useMemo(() => classes.find(c => c.id === selectedClassId) || classes[0] || null, [classes, selectedClassId]);
          const activeTicket = useMemo(() => tickets.find(t => t.classId === selectedClassId && t.active) || tickets.find(t => t.classId === selectedClassId) || null, [tickets, selectedClassId]);
          const currentSubmissions = useMemo(() => activeTicket ? submissions.filter(s => s.ticketId === activeTicket.id) : [], [submissions, activeTicket]);

          useEffect(() => {
            if (currentClass && currentClass.students.length > 0) {
              if (!currentClass.students.some(s => s.id === selectedStudentId)) {
                setSelectedStudentId(currentClass.students[0].id);
              }
              if (!activeStudentId) {
                setActiveStudentId(currentClass.students[0].id);
              }
            }
          }, [selectedClassId, currentClass]);

          const handleCreateClass = (e) => {
            e.preventDefault();
            if (!newClassName.trim()) return;

            const studentList = bulkStudentNames.split('\n').map(s => s.trim()).filter(s => s.length > 0).map((name, index) => ({
              id: `st-${Date.now()}-${index}`,
              name,
              avatar: name.split(' ').map(n => n[0]).join('').toUpperCase()
            }));

            const newClass = {
              id: `class-${Date.now()}`,
              name: newClassName,
              subject: newClassSubject || 'Cymraeg / Welsh',
              grade: newClassGrade || 'All Years',
              concepts: ['Treigladau (Mutations)', 'Amser Gorffennol (Past Tense)', 'Patrymau Iaith (Sentence Patterns)'],
              students: studentList.length > 0 ? studentList : [{ id: `st-${Date.now()}-1`, name: 'Aled Hughes', avatar: 'AH' }]
            };

            setClasses([...classes, newClass]);
            setSelectedClassId(newClass.id);
            setNewClassName(''); setNewClassSubject(''); setNewClassGrade(''); setBulkStudentNames('');
            setShowNewClassModal(false);
          };

          const handleAddConcept = () => {
            if (!newConceptInput.trim() || !currentClass) return;
            setClasses(classes.map(c => c.id === currentClass.id ? { ...c, concepts: [...(c.concepts || []), newConceptInput.trim()] } : c));
            setNewConceptInput('');
          };

          const handleRemoveConcept = (conceptToRemove) => {
            setClasses(classes.map(c => c.id === currentClass.id ? { ...c, concepts: c.concepts.filter(item => item !== conceptToRemove) } : c));
          };

          const handleCreateTicket = (e) => {
            e.preventDefault();
            if (!newTicketTitle.trim() || !currentClass) return;
            const updatedTickets = tickets.map(t => t.classId === currentClass.id ? { ...t, active: false } : t);
            const newTicket = {
              id: `ticket-${Date.now()}`,
              classId: currentClass.id,
              title: newTicketTitle,
              topic: newTicketTopic || 'Gramadeg a Geirfa',
              date: new Date().toISOString().split('T')[0],
              active: true,
              targetConcepts: currentClass.concepts || []
            };
            setTickets([newTicket, ...updatedTickets]);
            setNewTicketTitle(''); setNewTicketTopic(''); setShowNewTicketModal(false);
          };

          const handleSimulateSubmissions = () => {
            if (!activeTicket || !currentClass) return;
            const difficultPool = [...(currentClass.concepts || ['Treigladau']), 'None / All clear'];
            const explainOptions = ['Yes', 'Almost', 'Not yet'];

            const simulated = currentClass.students.map(student => {
              const conf = Math.floor(Math.random() * 5) + 1;
              const concept = difficultPool[Math.floor(Math.random() * difficultPool.length)];
              const exp = explainOptions[Math.floor(Math.random() * explainOptions.length)];

              return {
                id: `sim-${Date.now()}-${student.id}`,
                ticketId: activeTicket.id,
                studentId: student.id,
                studentName: student.name,
                timestamp: new Date().toISOString(),
                confidence: conf,
                difficultConcept: concept,
                difficultyReflection: conf < 3 ? `Struggling with ${concept} rule.` : `Felt confident on ${concept}.`,
                canExplain: exp,
                explanationText: exp === 'Yes' ? 'Verb comes first in Welsh sentence structure.' : 'Soft mutations alter initial consonant letters.',
                clarity: Math.floor(Math.random() * 2) + 4,
                examples: Math.floor(Math.random() * 3) + 3,
                pace: Math.floor(Math.random() * 3) + 3,
                practice: Math.floor(Math.random() * 3) + 3,
                nextSteps: Math.floor(Math.random() * 2) + 4
              };
            });

            setSubmissions([...simulated, ...submissions.filter(s => s.ticketId !== activeTicket.id)]);
          };

          const handleStudentSubmit = (e) => {
            e.preventDefault();
            if (!activeTicket || !activeStudentId) return;

            const studentObj = currentClass?.students.find(s => s.id === activeStudentId);
            const newSub = {
              id: `sub-${Date.now()}`,
              ticketId: activeTicket.id,
              studentId: activeStudentId,
              studentName: studentObj ? studentObj.name : 'Anonymous',
              timestamp: new Date().toISOString(),
              ...studentForm
            };

            setSubmissions([newSub, ...submissions.filter(s => !(s.ticketId === activeTicket.id && s.studentId === activeStudentId))]);
            setSubmittedSuccess(true);
            setTimeout(() => setSubmittedSuccess(false), 4000);
          };

          const analytics = useMemo(() => {
            if (!currentSubmissions.length) {
              return { avgConfidence: 0, needsSupport: [], conceptCounts: {}, feedbackAverages: { clarity: 0, examples: 0, pace: 0, practice: 0, nextSteps: 0 }, explainStats: { Yes: 0, Almost: 0, 'Not yet': 0 } };
            }
            const total = currentSubmissions.length;
            const avgConf = (currentSubmissions.reduce((acc, s) => acc + (s.confidence || 0), 0) / total).toFixed(1);
            const flagged = currentSubmissions.filter(s => s.confidence <= 2 || s.canExplain === 'Not yet');

            const concepts = {};
            currentSubmissions.forEach(s => {
              if (s.difficultConcept && s.difficultConcept !== 'None / All clear') {
                concepts[s.difficultConcept] = (concepts[s.difficultConcept] || 0) + 1;
              }
            });

            const feedback = {
              clarity: +(currentSubmissions.reduce((a, b) => a + (b.clarity || 0), 0) / total).toFixed(1),
              examples: +(currentSubmissions.reduce((a, b) => a + (b.examples || 0), 0) / total).toFixed(1),
              pace: +(currentSubmissions.reduce((a, b) => a + (b.pace || 0), 0) / total).toFixed(1),
              practice: +(currentSubmissions.reduce((a, b) => a + (b.practice || 0), 0) / total).toFixed(1),
              nextSteps: +(currentSubmissions.reduce((a, b) => a + (b.nextSteps || 0), 0) / total).toFixed(1)
            };

            const explain = { Yes: 0, Almost: 0, 'Not yet': 0 };
            currentSubmissions.forEach(s => { if (s.canExplain) explain[s.canExplain] = (explain[s.canExplain] || 0) + 1; });

            return { avgConfidence: avgConf, needsSupport: flagged, conceptCounts: concepts, feedbackAverages: feedback, explainStats: explain };
          }, [currentSubmissions]);

          const selectedStudentData = useMemo(() => {
            if (!selectedStudentId) return null;
            const studentObj = currentClass?.students.find(s => s.id === selectedStudentId);
            const studentSubs = submissions.filter(s => s.studentId === selectedStudentId);

            const conceptHardships = {};
            studentSubs.forEach(s => {
              if (s.difficultConcept && s.difficultConcept !== 'None / All clear') {
                conceptHardships[s.difficultConcept] = (conceptHardships[s.difficultConcept] || 0) + 1;
              }
            });

            const progressionChartData = studentSubs.map(s => {
              const ticket = tickets.find(t => t.id === s.ticketId);
              return { date: ticket ? ticket.date : 'Recent', confidence: s.confidence, clarity: s.clarity };
            }).reverse();

            const avgConf = studentSubs.length ? (studentSubs.reduce((a, b) => a + b.confidence, 0) / studentSubs.length).toFixed(1) : 'N/A';

            return { info: studentObj, submissions: studentSubs, conceptHardships, progressionChartData, avgConfidence: avgConf };
          }, [selectedStudentId, currentClass, submissions, tickets]);

          return (
            <div className="min-h-screen flex flex-col font-sans">
              {/* Header Bar */}
              <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-4 py-3">
                <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center space-x-3">
                    <div className="bg-emerald-600 p-2 rounded-xl shadow-lg flex items-center justify-center font-bold text-white">CYM</div>
                    <div>
                      <h1 className="text-lg font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Cymraeg Pulse</h1>
                      <p className="text-xs text-slate-400">Welsh Language Teacher Workspace & Analytics</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    <select
                      value={selectedClassId}
                      onChange={(e) => setSelectedClassId(e.target.value)}
                      className="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-emerald-500">
                      {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                    <button onClick={() => setShowNewClassModal(true)} className="p-1.5 bg-slate-800 text-emerald-400 rounded-lg border border-slate-700">+</button>
                  </div>

                  <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs sm:text-sm">
                    <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-lg font-medium ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Dashboard</button>
                    <button onClick={() => setActiveTab('student-portal')} className={`px-3 py-1.5 rounded-lg font-medium ${activeTab === 'student-portal' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Student Portal</button>
                    <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-lg font-medium ${activeTab === 'admin' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Admin Setup</button>
                  </div>
                </div>
              </header>

              <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
                {/* Active Ticket Banner */}
                {activeTab !== 'admin' && (
                  <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-semibold uppercase text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">Active Exit Ticket</span>
                      <h2 className="text-base sm:text-lg font-bold text-white mt-1">{activeTicket ? activeTicket.title : 'No active ticket'}</h2>
                    </div>
                    <div className="flex space-x-2">
                      <button onClick={handleSimulateSubmissions} className="text-xs bg-slate-700 text-emerald-300 border border-emerald-500/30 px-3 py-2 rounded-xl">⚡ Simulate 5 Responses</button>
                      <button onClick={() => setShowQRModal(true)} className="text-xs bg-emerald-600 text-white px-3 py-2 rounded-xl">📱 Share QR</button>
                    </div>
                  </div>
                )}

                {/* TAB 1: TEACHER DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="flex border-b border-slate-800 space-x-6 text-sm">
                      <button onClick={() => setDashSubTab('understanding')} className={`pb-2 font-semibold border-b-2 ${dashSubTab === 'understanding' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}`}>1. Class Understanding</button>
                      <button onClick={() => setDashSubTab('feedback')} className={`pb-2 font-semibold border-b-2 ${dashSubTab === 'feedback' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}`}>2. Lesson Feedback</button>
                      <button onClick={() => setDashSubTab('learner')} className={`pb-2 font-semibold border-b-2 ${dashSubTab === 'learner' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'}`}>3. Learner View</button>
                    </div>

                    {dashSubTab === 'understanding' && (
                      <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                            <span className="text-xs text-slate-400">Total Submissions</span>
                            <p className="text-2xl font-bold text-white mt-1">{currentSubmissions.length} / {currentClass?.students.length || 0}</p>
                          </div>
                          <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                            <span className="text-xs text-slate-400">Avg Confidence</span>
                            <p className="text-2xl font-bold text-emerald-400 mt-1">{analytics.avgConfidence} / 5.0</p>
                          </div>
                          <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                            <span className="text-xs text-slate-400">Needs Support</span>
                            <p className="text-2xl font-bold text-amber-400 mt-1">{analytics.needsSupport.length}</p>
                          </div>
                          <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                            <span className="text-xs text-slate-400">Can Peer Explain</span>
                            <p className="text-2xl font-bold text-emerald-400 mt-1">{analytics.explainStats.Yes}</p>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                          <div className="lg:col-span-2 bg-slate-800/60 p-5 rounded-2xl border border-slate-700">
                            <h3 className="text-base font-bold text-white mb-3">🗺️ Welsh Concept Difficulty Heatmap</h3>
                            <div className="space-y-3">
                              {Object.entries(analytics.conceptCounts).map(([concept, count]) => (
                                <div key={concept} className="space-y-1">
                                  <div className="flex justify-between text-xs">
                                    <span>{concept}</span>
                                    <span className="text-amber-400 font-bold">{count} struggles</span>
                                  </div>
                                  <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                    <div className="bg-amber-500 h-2 rounded-full" style={{ width: `${(count / currentSubmissions.length) * 100}%` }}></div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div className="bg-slate-800/60 p-5 rounded-2xl border border-slate-700">
                            <h3 className="text-base font-bold text-white mb-3">⚠️ Priority Support Roster</h3>
                            <div className="space-y-2 max-h-60 overflow-y-auto">
                              {analytics.needsSupport.map(item => (
                                <div key={item.id} className="p-3 bg-slate-900 rounded-xl border border-amber-500/30 flex justify-between items-center text-xs">
                                  <div>
                                    <p className="font-bold text-white">{item.studentName}</p>
                                    <p className="text-amber-400 text-[11px]">{item.difficultConcept}</p>
                                  </div>
                                  <span className="bg-amber-950 text-amber-400 px-2 py-0.5 rounded font-bold">Conf: {item.confidence}/5</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {dashSubTab === 'feedback' && (
                      <div className="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 space-y-6">
                        <h3 className="text-base font-bold text-white">📈 Lesson Feedback Indicators (Section B)</h3>
                        {BarChart && (
                          <div className="h-64 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                              <BarChart data={[
                                { name: 'Explanations Clear', rating: analytics.feedbackAverages.clarity },
                                { name: 'Examples Helpful', rating: analytics.feedbackAverages.examples },
                                { name: 'Pace Right', rating: analytics.feedbackAverages.pace },
                                { name: 'Practise Opportunity', rating: analytics.feedbackAverages.practice },
                                { name: 'Next Steps Clear', rating: analytics.feedbackAverages.nextSteps }
                              ]}>
                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                <XAxis dataKey="name" stroke="#94a3b8" tick={{ fontSize: 11 }} />
                                <YAxis domain={[0, 5]} stroke="#94a3b8" />
                                <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569' }} />
                                <Bar dataKey="rating" fill="#10b981" radius={[6, 6, 0, 0]} />
                              </BarChart>
                            </ResponsiveContainer>
                          </div>
                        )}
                      </div>
                    )}

                    {dashSubTab === 'learner' && selectedStudentData && (
                      <div className="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 space-y-6">
                        <div className="flex justify-between items-center">
                          <h3 className="text-lg font-bold text-white">{selectedStudentData.info?.name}</h3>
                          <select value={selectedStudentId} onChange={(e) => setSelectedStudentId(e.target.value)} className="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-1.5">
                            {currentClass?.students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                          </select>
                        </div>
                        {LineChart && selectedStudentData.progressionChartData.length > 0 && (
                          <div className="h-56 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                              <LineChart data={selectedStudentData.progressionChartData}>
                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                <XAxis dataKey="date" stroke="#94a3b8" />
                                <YAxis domain={[0, 5]} stroke="#94a3b8" />
                                <Tooltip contentStyle={{ backgroundColor: '#1e293b' }} />
                                <Line type="monotone" dataKey="confidence" stroke="#10b981" strokeWidth={3} />
                              </LineChart>
                            </ResponsiveContainer>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 2: STUDENT PORTAL */}
                {activeTab === 'student-portal' && (
                  <div className="max-w-xl mx-auto bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
                    <h2 className="text-lg font-bold text-white border-b border-slate-700 pb-3">📝 Exit Ticket / Tocyn Allan</h2>
                    <form onSubmit={handleStudentSubmit} className="space-y-5">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Select Student:</label>
                        <select value={activeStudentId} onChange={(e) => setActiveStudentId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg p-2.5">
                          {currentClass?.students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">How confident do you feel? (1 - 5)</label>
                        <div className="flex gap-2">
                          {[1, 2, 3, 4, 5].map(num => (
                            <button key={num} type="button" onClick={() => setStudentForm({ ...studentForm, confidence: num })} className={`flex-1 py-2 rounded-lg font-bold text-xs border ${studentForm.confidence === num ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>{num}</button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Difficult Welsh Concept:</label>
                        <select value={studentForm.difficultConcept} onChange={(e) => setStudentForm({ ...studentForm, difficultConcept: e.target.value })} className="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg p-2.5">
                          {currentClass?.concepts.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>

                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">Submit Response</button>
                      {submittedSuccess && <p className="text-xs text-emerald-400 text-center">Submitted successfully!</p>}
                    </form>
                  </div>
                )}

                {/* TAB 3: ADMIN SETUP */}
                {activeTab === 'admin' && (
                  <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-6">
                    <h2 className="text-lg font-bold text-white">⚙️ Welsh Curriculum Setup</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-slate-900 p-4 rounded-xl space-y-3">
                        <h3 className="text-sm font-bold text-white">Class Concepts</h3>
                        <div className="flex gap-2">
                          <input type="text" value={newConceptInput} onChange={(e) => setNewConceptInput(e.target.value)} placeholder="New concept..." className="flex-1 bg-slate-800 border border-slate-700 text-xs rounded-lg p-2" />
                          <button onClick={handleAddConcept} className="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg">Add</button>
                        </div>
                        <div className="flex flex-wrap gap-2 pt-2">
                          {currentClass?.concepts.map(c => (
                            <span key={c} className="bg-slate-800 border border-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-200 flex items-center gap-1">
                              {c} <button onClick={() => handleRemoveConcept(c)} className="text-rose-400">×</button>
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
