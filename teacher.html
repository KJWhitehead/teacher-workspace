<!DOCTYPE html>
<html lang="cy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Workspace & Analytics</title>
<script>
        console.warn = (function(oldWarn) {
            return function(msg) {
                if (typeof msg === 'string' && msg.includes('cdn.tailwindcss.com')) return;
                oldWarn.apply(console, arguments);
            };
        })(console.warn);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-600 text-white font-bold text-[10px] px-2 py-0.5 rounded-full">LIVE</span>
                    <h1 class="text-xl font-bold text-white">Teacher Admin & Poll Manager</h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Topic: <span id="hdr-topic" class="text-white font-semibold">--</span></p>
            </div>

            <div class="flex flex-wrap gap-2">
                <button onclick="toggleModal('poll-modal', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">
                    ➕ Create New Poll
                </button>
                <button onclick="showQRModal()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">
                    📱 Display Student QR Code
                </button>
            </div>
        </header>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <span class="text-xs text-slate-400 font-semibold uppercase">Total Responses</span>
                <p id="stat-total" class="text-3xl font-bold text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <span class="text-xs text-slate-400 font-semibold uppercase">Avg Confidence</span>
                <p id="stat-avg" class="text-3xl font-bold text-emerald-400 mt-1">0.0 / 5.0</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <span class="text-xs text-slate-400 font-semibold uppercase">Needs Support (Conf ≤ 2)</span>
                <p id="stat-flagged" class="text-3xl font-bold text-amber-400 mt-1">0</p>
            </div>
        </div>

        <!-- Live Submissions -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-white">Live Student Responses</h3>
                <button onclick="clearSubmissions()" class="text-xs text-rose-400 hover:text-rose-300">Reset Responses</button>
            </div>
            <div id="submissions-list" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-xs text-slate-500 italic py-4">No student responses yet.</p>
            </div>
        </div>
    </div>

    <!-- Modal 1: Create Poll -->
    <div id="poll-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-md w-full space-y-4 shadow-2xl">
            <h3 class="font-bold text-white text-base">Create New Exit Ticket Poll</h3>
            <form id="create-poll-form" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Subject / Class Name:</label>
                    <input type="text" id="new-subject" required value="Welsh Second Language" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Topic Title (Lesson Today):</label>
                    <input type="text" id="new-title" required placeholder="e.g. Amser Dyfodol (Future Tense)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="toggleModal('poll-modal', false)" class="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-xl">Cancel</button>
                    <button type="submit" class="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl">Publish Poll</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: QR Code -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-sm w-full text-center space-y-4">
            <h3 class="font-bold text-white text-lg">Scan Student Exit Ticket QR Code</h3>
            <div id="qrcode" class="bg-white p-4 rounded-xl inline-block"></div>
            <input type="text" id="qr-url-input" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-400 text-center">
            <button onclick="toggleModal('qr-modal', false)" class="w-full bg-slate-700 text-white font-bold py-2 rounded-xl text-xs">Close</button>
        </div>
    </div>

    <script>
        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        function showQRModal() {
            toggleModal('qr-modal', true);
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            const studentUrl = window.location.href.replace('teacher.html', 'index.html');
            document.getElementById('qr-url-input').value = studentUrl;
            new QRCode(qrContainer, {
                text: studentUrl,
                width: 180,
                height: 180
            });
        }

        function loadDashboard() {
            const activePoll = JSON.parse(localStorage.getItem('welsh_active_poll') || 'null') || {
                topicTitle: 'Treigladau a’r Amser Gorffennol (Mutations & Past Tense)'
            };
            document.getElementById('hdr-topic').innerText = activePoll.topicTitle;

            const subs = JSON.parse(localStorage.getItem('welsh_et_submissions') || '[]');
            document.getElementById('stat-total').innerText = subs.length;

            if (subs.length > 0) {
                const avg = (subs.reduce((a, b) => a + Number(b.confidence), 0) / subs.length).toFixed(1);
                document.getElementById('stat-avg').innerText = avg + ' / 5.0';
                
                const flagged = subs.filter(s => Number(s.confidence) <= 2).length;
                document.getElementById('stat-flagged').innerText = flagged;

                const list = document.getElementById('submissions-list');
                list.innerHTML = '';
                subs.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center text-xs';
                    card.innerHTML = `
                        <div>
                            <span class="font-bold text-white text-sm">${s.studentName}</span>
                            <p class="text-slate-400 mt-0.5">Struggle: <span class="text-amber-300">${s.difficultConcept}</span></p>
                        </div>
                        <span class="px-2.5 py-1 rounded-full font-bold text-xs ${Number(s.confidence) <= 2 ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">
                            Conf: ${s.confidence}/5
                        </span>
                    `;
                    list.appendChild(card);
                });
            }
        }

        document.getElementById('create-poll-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const subject = document.getElementById('new-subject').value;
            const topicTitle = document.getElementById('new-title').value;

            const poll = {
                subject,
                topicTitle,
                concepts: [
                    "Grammar & Sentence Patterns",
                    "Vocabulary & Pronunciation",
                    "Verb Tenses",
                    "Conversational Practice"
                ]
            };

            localStorage.setItem('welsh_active_poll', JSON.stringify(poll));
            toggleModal('poll-modal', false);
            loadDashboard();
        });

        function clearSubmissions() {
            if (confirm("Reset all responses for this session?")) {
                localStorage.setItem('welsh_et_submissions', JSON.stringify([]));
                loadDashboard();
            }
        }

        // Auto-refresh live responses every 2 seconds
        setInterval(loadDashboard, 2000);
        loadDashboard();
    </script>
</body>
</html>
